<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>CF Arcade</title>
  <meta name="description" content="A retro arcade-style Codeforces dashboard for any handle.">
  <meta name="theme-color" content="#0b0b14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=13">
</head>
<body class="crt">
  <div id="start-screen">
    <div class="logo">CF<span>ARCADE</span></div>
    <div class="start-player">PLAYER 1: <b id="start-handle"></b></div>
    <div class="press blink">PRESS START</div>
    <div class="start-hint">TAP ANYWHERE · ENABLES SOUND AND FULL SCREEN</div>
  </div>

  <header id="hud">
    <div id="hud-left"></div>
    <div id="hud-center">
      <button class="arrow" data-action="prev" aria-label="Previous board">&#9664;</button>
      <div id="hud-title"></div>
      <button class="arrow" data-action="next" aria-label="Next board">&#9654;</button>
    </div>
    <div id="hud-right"></div>
  </header>

  <main id="viewport"><div id="track"></div></main>
  <nav id="dots"></nav>

  <div id="night"></div>

  <div id="radio-panel" aria-label="CF FM radio"></div>

  <div id="settings" class="modal">
    <div class="modal-box">
      <div class="modal-head"><span class="set-tabs">
        <button class="chip on" data-action="set-tab" data-tab="form">⚙ SETTINGS</button>
        <button class="chip" data-action="set-tab" data-tab="achievements">♕ ACHIEVEMENTS</button>
        <button class="chip" data-action="set-tab" data-tab="records">★ HALL OF RECORDS</button>
        <button class="chip" data-action="set-tab" data-tab="year">✦ YEAR IN REVIEW</button>
      </span><button class="icon-btn" data-action="close-settings" aria-label="Close">✕</button></div>
      <div class="modal-body">
        <div class="set-pane set-form" data-pane="form"></div>
        <div class="set-pane" data-pane="achievements" hidden></div>
        <div class="set-pane" data-pane="records" hidden></div>
        <div class="set-pane" data-pane="year" hidden></div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" data-action="close-settings">CANCEL</button>
        <button class="btn" data-action="save-settings">SAVE</button>
      </div>
    </div>
  </div>

  <div id="vmodal" class="modal">
    <div class="modal-box">
      <div class="modal-head">⚔ VIRTUAL CONTEST<button class="icon-btn" data-action="close-virtual" aria-label="Close">✕</button></div>
      <div class="modal-body"></div>
      <div class="modal-foot">
        <button class="btn ghost" data-action="close-virtual">CANCEL</button>
        <button class="btn" data-action="virtual-start">▶ START</button>
      </div>
    </div>
  </div>

  <div id="card" class="modal">
    <div class="modal-box">
      <div class="modal-head"><span class="card-title"></span><button class="icon-btn" data-action="card-close" aria-label="Close">✕</button></div>
      <div class="modal-body"></div>
      <div class="modal-foot"><button class="btn card-go" data-action="card-close">LET'S GO</button></div>
    </div>
  </div>

  <canvas id="fx-canvas"></canvas>
  <div id="fx-layer"></div>
  <div id="toasts"></div>
  <div class="scanlines"></div>

  <script src="js/util.js?v=13"></script>
  <script src="js/api.js?v=13"></script>
  <script src="js/stats.js?v=13"></script>
  <script src="js/sound.js?v=13"></script>
  <script src="js/fx.js?v=13"></script>
  <script src="js/charts.js?v=13"></script>
  <script src="js/boards.js?v=13"></script>
  <script src="js/live.js?v=13"></script>
  <script src="js/radio.js?v=13"></script>
  <script src="js/stopwatch.js?v=13"></script>
  <script src="js/extras.js?v=13"></script>
  <script src="js/team.js?v=13"></script>
  <script src="js/app.js?v=13"></script>
</body>
</html>
